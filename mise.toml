[tools]
"npm:patchy-cli" = "0.0.20"
"pipx:qmk" = "1.1.8"

[tasks.build]
run = """
patchy repo reset --yes && patchy apply --auto-commit all && \
cd "$(patchy config get target_repo_path)" && \
make cyboard/imprint/imprint_number_row_5key_bottom_row:default
"""
description = "Reset, apply patches, build firmware"

[tasks.build-docker]
run = """
patchy repo reset --yes && patchy apply --auto-commit all && \
qmk_dir="$(patchy config get target_repo_path)" && \
docker run --rm -v "$qmk_dir:/qmk_firmware" -w /qmk_firmware ghcr.io/qmk/qmk_cli \
make cyboard/imprint/imprint_number_row_5key_bottom_row:default
"""
description = "Reset, apply patches, build via Docker"

[tasks.generate]
run = "patchy generate"
description = "Generate diffs from current repo state"

[tasks.flash]
wait_for = ["build"]
run = """
cd "$(patchy config get target_repo_path)" && \
echo "Connect LEFT half in bootloader mode..." && \
./util/uf2conv.py --wait --deploy cyboard_imprint_imprint_number_row_5key_bottom_row_default.uf2 && \
echo "Connect RIGHT half in bootloader mode..." && \
./util/uf2conv.py --wait --deploy cyboard_imprint_imprint_number_row_5key_bottom_row_default.uf2
"""
description = "Flash both halves with existing UF2 (left, then right)"

[tasks.build-flash]
depends = ["build", "flash"]
description = "Reset, apply patches, build, and flash both halves"

[tasks.build-cosmos-1]
run = "bash ./scripts/cosmos-task.sh build 1 default"
description = "Reset, apply patches, and build Cosmos custom_1 default firmware"

[tasks.build-cosmos-2]
run = "bash ./scripts/cosmos-task.sh build 2 default"
description = "Reset, apply patches, and build Cosmos custom_2 default firmware"

[tasks.build-cosmos-raw-1]
run = "bash ./scripts/cosmos-task.sh build 1 raw_matrix_scan"
description = "Reset, apply patches, and build Cosmos custom_1 raw matrix scan firmware"

[tasks.build-cosmos-raw-2]
run = "bash ./scripts/cosmos-task.sh build 2 raw_matrix_scan"
description = "Reset, apply patches, and build Cosmos custom_2 raw matrix scan firmware"

[tasks.flash-cosmos-1]
wait_for = ["build-cosmos-1"]
run = "bash ./scripts/cosmos-task.sh flash 1 default"
description = "Flash Cosmos custom_1 both halves (left, then right)"

[tasks.flash-cosmos-2]
wait_for = ["build-cosmos-2"]
run = "bash ./scripts/cosmos-task.sh flash 2 default"
description = "Flash Cosmos custom_2 both halves (left, then right)"

[tasks.flash-cosmos-raw-1]
wait_for = ["build-cosmos-raw-1"]
run = "bash ./scripts/cosmos-task.sh flash 1 raw_matrix_scan"
description = "Flash Cosmos custom_1 raw matrix scan firmware to both halves"

[tasks.flash-cosmos-raw-2]
wait_for = ["build-cosmos-raw-2"]
run = "bash ./scripts/cosmos-task.sh flash 2 raw_matrix_scan"
description = "Flash Cosmos custom_2 raw matrix scan firmware to both halves"

[tasks.build-flash-cosmos-1]
depends = ["build-cosmos-1", "flash-cosmos-1"]
description = "Build and flash Cosmos custom_1 both halves"

[tasks.build-flash-cosmos-2]
depends = ["build-cosmos-2", "flash-cosmos-2"]
description = "Build and flash Cosmos custom_2 both halves"

[tasks.build-flash-cosmos-raw-1]
depends = ["build-cosmos-raw-1", "flash-cosmos-raw-1"]
description = "Build and flash Cosmos custom_1 raw matrix scan firmware to both halves"

[tasks.build-flash-cosmos-raw-2]
depends = ["build-cosmos-raw-2", "flash-cosmos-raw-2"]
description = "Build and flash Cosmos custom_2 raw matrix scan firmware to both halves"
